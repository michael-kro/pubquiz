# When a release lands on main with a new version in package.json (cut with `npm run release`): tag it, publish the
# GitHub release with the changelog section as its notes, keep only that release on the releases page (older tags
# stay), and build the image for the tag. The workflow's own token is enough for all of it.
name: Publish release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Which version, and is it new?
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged; nothing to publish."
            echo "new=no" >> "$GITHUB_OUTPUT"
          else
            echo "new=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and publish the release
        if: steps.version.outputs.new == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release.ts notes "$VERSION" > notes.md
          git config user.name 'pubquiz release'
          git config user.email 'release@users.noreply.github.com'
          git tag -a "v$VERSION" -m "pubquiz $VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "pubquiz $VERSION" --notes-file notes.md --latest
          # Only the newest release is kept on the releases page; the tags of the older ones remain.
          for old in $(gh release list --limit 100 --json tagName --jq ".[] | select(.tagName != \"v$VERSION\") | .tagName"); do
            gh release delete "$old" --yes
          done
          echo "Published v$VERSION" >> "$GITHUB_STEP_SUMMARY"

      # Run by the tag, so the image gets its version tags (a release created by a workflow does not start other workflows).
      - name: Build the image for the tag
        if: steps.version.outputs.new == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run docker-image.yml --ref "v$VERSION"

