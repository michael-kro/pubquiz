# Checks that run on every push and pull request: types, tests, the load test, the browser screen tour, dependency audit, secret scan.
# Semgrep, CodeQL and image scanning are in security.yml; ZAP and nuclei in dast.yml.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Types and tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the oldest Node the app supports (engines in package.json); 24 is what the Docker image uses.
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No install scripts: the tests do not need them, and running fewer scripts is safer.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:fast

  load-test:
    name: Load test (30 simulated phones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      # It drops and reconnects phones on purpose and is the one test that depends on machine speed,
      # so it runs on its own and gets one more try before it fails the build.
      - run: |
          for attempt in 1 2; do
            if npm run test:slow; then exit 0; fi
            echo "Load test failed on attempt $attempt"
          done
          exit 1

  screen-tour:
    name: Screen tour (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      # A real browser plays the sample quiz on every screen (test/browser/tour.spec.ts) and fails on page
      # errors, sideways overflow, off-screen buttons or a pop-up Escape does not close.
      - run: npm run test:browser
      # Every screen state, as a picture, whether or not the tour passed; plus the trace of a failure.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-tour
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # Only what ships to users (not the build tools). High and critical advisories fail the build.
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Scans the whole history, because this repo's history was scrubbed once already and should stay clean.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git --no-banner --redact -v /repo

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
