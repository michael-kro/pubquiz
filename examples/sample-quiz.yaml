# Sample quiz. Run it with: npm start -- examples/sample-quiz.yaml
#
# Question types:
#   multiple-choice  options (2-4) and answer: the position of the right option, counting from 0 (0 = A, 1 = B …)
#   picture          image plus accept: the answers to accept. Teams type their answer.
#   music            accept only. Play the track yourself; teams type their answer.
#   ordering         items: exactly 5, listed in the CORRECT order. Teams see them shuffled.
#   number           answer: a number. Teams type it. Optional tolerance: give or take.
#   nearest          answer: a number. Teams type a guess and the closest wins (a good bonus question).
#   buzzer           answer: what you're looking for. Teams get a big BUZZ button; the first to buzz answers
#                    out loud and you press Correct or Wrong. A wrong team is out; optional penalty: points lost.
#   letter           answer: the full answer. Teams tap its first letter on an A-Z keypad
#                    (classic style). "The" is skipped and people go by first name, so
#                    write "John Lennon" and the letter is J. Add letter: X if it can't be worked out.
#
# Typed answers are matched ignoring case, punctuation, a leading "the" and small typos.
# You confirm or change every mark before revealing.
#
# Every question can also have:
#   seconds     time limit (default 20)
#   points      maximum points (default 1000)
#   image       a picture to show (path relative to this file, or a web address)
#   speedBonus  true/false: faster answers earn more (default true, but false for music)
title: Friday Night Quiz
scoring:
  speedFactor: 0.5   # a correct answer at the buzzer earns half the points; 0 turns the speed bonus off
  fastBonus: 250     # extra points for the quickest correct teams on every question (0 = off)
  fastPlaces: 3      # 1, 2 or 3 teams earn it: 100%, 60% and 30% of fastBonus

rounds:
  - name: General Knowledge
    questions:
      - type: multiple-choice
        text: What is the capital of Australia?
        options: [Sydney, Canberra, Melbourne, Perth]
        answer: 1
      - type: multiple-choice
        text: How many players are on the pitch for one football team?
        options: ["9", "10", "11", "12"]
        answer: 2
        seconds: 15
      - type: multiple-choice
        text: Which planet is known as the Red Planet?
        options: [Venus, Jupiter, Mars, Mercury]
        answer: 2
        seconds: 15
      - type: multiple-choice
        text: What is the chemical symbol for gold?
        options: [Go, Gd, Au, Ag]
        answer: 2
      - type: multiple-choice
        text: In which year did the Berlin Wall fall?
        options: ["1987", "1989", "1991", "1993"]
        answer: 1

  - name: Pot Luck
    questions:
      - type: multiple-choice
        text: Which of these is NOT a primary colour of light?
        options: [Red, Green, Yellow, Blue]
        answer: 2
      - type: multiple-choice
        text: How many sides does a hexagon have?
        options: ["5", "6", "7", "8"]
        answer: 1
        seconds: 10
      - type: multiple-choice
        text: Who painted the Mona Lisa?
        options: [Michelangelo, Raphael, Leonardo da Vinci, Donatello]
        answer: 2
      - type: multiple-choice
        text: What is the largest ocean on Earth?
        options: [Atlantic, Indian, Arctic, Pacific]
        answer: 3
      - type: multiple-choice
        text: True or false? A tomato is a fruit.
        options: ["True", "False"]
        answer: 0
        seconds: 10

  - name: Picture Round
    questions:
      - type: picture
        text: Which country's flag is this?
        image: images/flag-japan.svg
        accept: [Japan]
        seconds: 20
      - type: picture
        text: And this one?
        image: images/flag-france.svg
        accept: [France]
        seconds: 20

  - name: Put It In Order
    questions:
      - type: ordering
        text: Put these planets in order, closest to the Sun first
        items: [Mercury, Venus, Earth, Mars, Jupiter]
        seconds: 45
      - type: ordering
        text: Oldest first
        items: [Great Pyramid of Giza, Colosseum, Leaning Tower of Pisa, Eiffel Tower, Burj Khalifa]
        seconds: 45

  - name: Music Round
    questions:
      - type: music
        text: "Track 1: name the band"
        accept: [Queen]
        seconds: 30
      - type: music
        text: "Track 2: name the song"
        accept: [Bohemian Rhapsody]
        seconds: 30

  - name: First Letter
    questions:
      - type: letter
        text: Which Beatle wrote "Imagine"?
        answer: John Lennon
        seconds: 15
      - type: letter
        text: Which Disney film features the song "Hakuna Matata"?
        answer: The Lion King
        seconds: 15

  - name: Buzzers
    questions:
      - type: buzzer
        text: Which city is the capital of Australia?
        answer: Canberra
        seconds: 30
        penalty: 200
        info: Not Sydney, and not Melbourne!
      - type: number
        text: In what year did humans first walk on the Moon?
        answer: 1969
      - type: nearest
        text: How tall is Mount Everest, in metres?
        answer: 8849
