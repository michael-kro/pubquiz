topic: Science
facts:
  - "Bananas are very slightly radioactive because they contain a form of potassium called potassium-40."
  - "Ice floats because water expands as it freezes, making ice less dense than liquid water."
  - "A bolt of lightning is about five times hotter than the surface of the Sun."
  - "Sound travels roughly four times faster through water than through air."
  - "Diamond and graphite, the stuff in pencils, are both made of pure carbon."
  - "One gram of gold can be hammered into a sheet of about one square metre."
  - "Helium was detected in the Sun's light in 1868, nearly thirty years before it was found on Earth."
  - "Mercury and bromine are the only two elements that are liquid at normal room temperature."
  - "Oxygen is the most abundant element in the Earth's crust by mass."
  - "Absolute zero, the coldest possible temperature, is minus 273.15 degrees Celsius."
  - "Hydrogen is the most abundant element in the universe."
  - "Pure water barely conducts electricity; it is the dissolved salts in it that do the job."
  - "You can see a rainbow as a full circle from an aeroplane, because the ground normally cuts it off."
  - "Sound cannot travel through a vacuum, because it needs something to pass through."
  - "A pitch drop experiment at the University of Queensland began in 1927, and its drops of pitch fall roughly ten years apart."
  - "Marie Curie won Nobel Prizes in two different sciences: Physics in 1903 and Chemistry in 1911."
  - "Tungsten has the highest melting point of any metal, at about 3,400 degrees Celsius."
  - "Salt is made of a highly reactive metal, sodium, and a poisonous gas, chlorine."
  - "The chemical symbol for gold, Au, comes from aurum, the Latin word for gold."
  - "Lightning striking sand can fuse it into glassy tubes called fulgurites."
  - "Water boils at a lower temperature on a mountain top than at sea level."
  - "Soap works because each molecule has one end that loves water and another that loves grease."
  - "The word scientist was coined in the 1830s by the English polymath William Whewell."
  - "Isaac Newton did some of his most famous work at home in 1665 and 1666, when plague closed Cambridge University."
  - "Pi is irrational: its digits go on forever without ever settling into a repeating pattern."
  - "Light travels at about 300,000 kilometres every second."
  - "Most of the fresh water on Earth is locked up as ice, mainly in Antarctica and Greenland."
  - "Metal objects feel colder than wood at the same temperature because metal draws heat from your hand faster."
  - "A flame in space burns as a ball rather than a teardrop, because there is no gravity to make hot air rise."
  - "Rust is simply iron slowly combining with oxygen, usually helped along by water."
  - "Water is at its densest at about 4 degrees Celsius, which is why lakes freeze from the top down."
  - "Glass is made mainly from sand, heated until it melts."
  - "Dry ice is solid carbon dioxide, and it turns straight into gas without becoming liquid first."
  - "The Eiffel Tower can grow by up to about 15 centimetres in hot weather as its iron expands."
