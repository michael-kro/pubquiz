topic: Nature and Animals
facts:
  - "An octopus has three hearts and blue blood."
  - "A group of flamingos is called a flamboyance."
  - "Wombats produce cube-shaped droppings."
  - "Honey bees tell their hive-mates where flowers are by performing a waggle dance."
  - "Sea otters sometimes hold hands while they rest so they do not drift apart."
  - "Crows can recognise individual human faces and remember who treated them badly."
  - "Giraffes have the same number of neck bones as humans: seven."
  - "A cow has a stomach with four compartments."
  - "Male penguins of some species offer pebbles to a mate as a gift."
  - "Koalas have fingerprints so similar to human ones that they are hard to tell apart even under a microscope."
  - "Starfish have no brain and no blood."
  - "Axolotls can regrow lost limbs, and even parts of their hearts and brains."
  - "Tardigrades, or water bears, have survived being exposed to the vacuum of space."
  - "Crocodiles cannot stick their tongues out."
  - "Butterflies taste with their feet."
  - "In seahorses, it is the male that gives birth."
  - "A dog's nose print is unique, much like a human fingerprint."
  - "Coast redwoods can grow taller than 110 metres."
  - "Young sunflowers turn to follow the Sun across the sky."
  - "Owls cannot move their eyes, so they turn their heads, up to about 270 degrees."
  - "The platypus is a mammal that lays eggs."
  - "Sharks are older than trees: they have been around for over 400 million years."
  - "Polar bears have black skin under their white-looking fur."
  - "Horses can sleep standing up."
  - "Dolphins sleep with half of their brain at a time."
  - "A cheetah can accelerate from standing to about 100 km/h in roughly three seconds."
  - "A diving peregrine falcon can exceed 300 kilometres per hour."
  - "Flamingos get their pink colour from pigments in the food they eat."
  - "The Arctic tern migrates from the Arctic to the Antarctic and back, travelling tens of thousands of kilometres a year."
  - "The blue whale is the largest animal known ever to have lived."
  - "Hummingbirds can hover and fly backwards, which most birds cannot do."
  - "The immortal jellyfish can revert to its juvenile form after reaching adulthood."
  - "Sloths come down from the trees to the toilet only about once a week."
  - "A giraffe's tongue is about 45 centimetres long and is dark in colour."
  - "Bamboo can grow almost a metre in a single day."
