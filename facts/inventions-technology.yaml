topic: Inventions and Technology
facts:
  - "The first webcam watched a coffee pot at the University of Cambridge, so researchers could see if it was full."
  - "Tim Berners-Lee proposed the World Wide Web in 1989 while working at CERN."
  - "The first text message, sent in 1992, read Merry Christmas."
  - "Bluetooth is named after Harald Bluetooth, a Viking king of Denmark."
  - "The first computer mouse, built by Douglas Engelbart in the 1960s, had a wooden shell."
  - "An early 1-gigabyte hard drive from 1980 weighed more than 200 kilograms."
  - "Alexander Fleming discovered penicillin in 1928 after noticing mould had killed bacteria on a dish."
  - "Velcro was inspired by burrs that stuck to the inventor's dog."
  - "Post-it notes came from a glue that was not sticky enough, invented at 3M."
  - "Alexander Graham Bell was granted the first US patent for the telephone in 1876."
  - "Alfred Nobel invented dynamite in 1867, and later left his fortune to fund the Nobel Prizes."
  - "Ray Tomlinson sent the first email between computers in 1971 and chose the @ symbol for addresses."
  - "The first product ever scanned with a barcode was a pack of chewing gum, in 1974."
  - "Pong, released by Atari in 1972, was one of the first hit video games."
  - "Teflon was discovered by accident in 1938 by a chemist named Roy Plunkett."
  - "Ada Lovelace published what is often called the first computer program in 1843, a century before modern computers."
  - "Google started life as a research project called BackRub."
  - "The Lego name comes from the Danish words leg godt, meaning play well."
  - "Walter Hunt patented the safety pin in 1849."
  - "Mary Anderson patented the windscreen wiper in 1903."
  - "Percy Shaw invented the reflective road stud, or cat's eye, in 1934."
  - "Elisha Otis demonstrated his safety elevator brake in 1854, making tall buildings practical."
  - "The first sliced bread was sold in 1928 in Chillicothe, Missouri."
  - "Ernő Rubik invented his cube in 1974, and it took him about a month to solve it himself."
  - "GPS satellites need corrections for Einstein's relativity, or their clocks would drift and positions would be off."
  - "Josephine Cochrane invented the first commercially successful dishwasher in the 1880s."
  - "The first transistor was built at Bell Labs in 1947."
  - "Steve Sasson built the first digital camera at Kodak in 1975; it took 23 seconds to record a photo."
  - "The first .com domain name ever registered was symbolics.com, in 1985."
  - "Actress Hedy Lamarr co-patented a frequency-hopping radio idea in 1942 that foreshadowed later wireless technology."
  - "The flushing toilet was designed by Sir John Harington, a godson of Queen Elizabeth I, in 1596."
  - "Ctrl+Alt+Delete was created by IBM engineer David Bradley."
  - "Chinese court official Cai Lun is traditionally credited with improving paper-making around the year 105."
  - "The Wright brothers ran a bicycle shop before they built aeroplanes."
