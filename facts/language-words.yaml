topic: Language and Words
facts:
  - "The word 'rhythm' is one of the longest in English with no a, e, i, o or u."
  - "The first Oxford English Dictionary took about 70 years to complete, from 1857 to 1928."
  - "Samuel Johnson's famous dictionary was published in 1755, after about nine years of work."
  - "Mandarin Chinese has more native speakers than any other language."
  - "The Hawaiian alphabet has just 13 letters."
  - "The word 'goodbye' began as a squashed version of 'God be with ye'."
  - "The word 'nice' originally meant foolish or ignorant."
  - "The word 'quarantine' comes from the Italian for forty days."
  - "The word 'robot' comes from the Czech word robota, meaning forced labour, and was made famous by a 1920 play."
  - "The word 'pyjamas' came into English from Hindi and Urdu."
  - "Shampoo, bungalow and jungle all came into English from Hindi."
  - "The word 'tattoo' comes from the Tahitian word tatau."
  - "The word 'emoji' has nothing to do with emotion. It is Japanese for picture character."
  - "The Japanese word 'tsundoku' means buying books and then leaving them unread in a pile."
  - "The word 'hippopotamus' is Greek for river horse."
  - "The word 'muscle' comes from the Latin for little mouse."
  - "The word 'window' comes from an Old Norse phrase meaning wind eye."
  - "The word 'alphabet' is made from the first two Greek letters, alpha and beta."
  - "The word 'mile' comes from the Latin for a thousand paces."
  - "The word 'disaster' comes from the Italian for bad star."
  - "'Typewriter' is the longest English word you can type using only the top row of a keyboard."
  - "'Stewardesses' is the longest English word that can be typed using only your left hand."
  - "'Bookkeeper' is one of the very few English words with three double letters in a row."
  - "The full name of the Welsh village usually shortened to Llanfairpwll has 58 letters, the longest place name in Britain."
  - "Esperanto was invented by L. L. Zamenhof and first published in 1887."
  - "The sentence 'The quick brown fox jumps over the lazy dog' uses every letter of the alphabet."
  - "Japanese is written using three scripts: hiragana, katakana and kanji."
  - "The ampersand was once recited as the 27th letter of the English alphabet."
  - "A misheard song lyric is called a mondegreen, a term coined by writer Sylvia Wright in 1954."
  - "British Sign Language and American Sign Language are completely different languages."
  - "The 'k' in 'knight' was once pronounced."
  - "'OK' spread after appearing in a Boston newspaper in 1839, in a fashion for joke abbreviations, where it stood for 'oll korrect'."
  - "Switzerland has four national languages: German, French, Italian and Romansh."
