topic: Food and Drink
facts:
  - "Botanically, bananas are berries but strawberries are not."
  - "Ketchup was once sold as a medicine in 1830s America."
  - "Worcestershire sauce was first made in Worcester by Lea and Perrins in 1837, and it contains fermented anchovies."
  - "The tomato is botanically a fruit, but in 1893 the US Supreme Court ruled it a vegetable for tax purposes."
  - "Cashew nuts grow hanging from the bottom of a fruit called the cashew apple."
  - "Peanuts are not nuts. They are legumes, related to peas and beans."
  - "White chocolate contains cocoa butter but no cocoa solids."
  - "Fry's of Bristol is widely credited with making the first chocolate bar, in 1847."
  - "Afternoon tea was popularised in the 1840s by Anna, Duchess of Bedford, who was hungry between lunch and dinner."
  - "The sandwich is named after John Montagu, the 4th Earl of Sandwich."
  - "Coffee beans are not beans. They are the seeds of a cherry-like fruit."
  - "Saffron is the world's most expensive spice by weight, and each crocus flower gives just three threads of it."
  - "Vanilla comes from an orchid."
  - "Stilton cheese can only be made in Derbyshire, Leicestershire and Nottinghamshire, and never in the village of Stilton."
  - "Cheddar cheese takes its name from the village of Cheddar in Somerset."
  - "Almonds are the seeds of a fruit that is closely related to the peach."
  - "Apples float in water because about a quarter of their volume is air."
  - "Heinz baked beans first went on sale in Britain in 1901, at Fortnum and Mason in London."
  - "Marmite is made from yeast extract, a by-product of brewing beer."
  - "Coca-Cola was invented in 1886 in Atlanta by a pharmacist called John Pemberton."
  - "Birds cannot feel the heat of chillies, which is why they happily eat and spread the seeds."
  - "The Aztecs used cocoa beans as a form of money."
  - "The kiwi fruit was once marketed as the Chinese gooseberry."
  - "A cucumber is about 95 percent water."
  - "Champagne can only legally be called Champagne if it comes from the Champagne region of France."
  - "To be called Scotch whisky, a spirit must be aged in oak for at least three years."
  - "Tonic water contains quinine, which was used to protect British colonists from malaria. The gin was added to make it taste better."
  - "Tequila is made from the blue agave plant."
  - "Most wasabi served outside Japan is actually horseradish with green colouring."
  - "Sushi began as a way to preserve fish by packing it in fermented rice."
  - "Sealed honey can last for thousands of years, because it has so little water and is naturally acidic."
  - "Rice is the main staple food for more than half of the world's population."
  - "A pineapple plant takes around two years to produce its fruit."
