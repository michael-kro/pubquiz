topic: Human Body
facts:
  - "Adults have 206 bones, but babies are born with around 300 that gradually fuse together."
  - "Your heart beats about 100,000 times a day."
  - "The smallest bone in your body, the stapes, is in your ear and is only about three millimetres long."
  - "Tooth enamel is the hardest substance in the human body."
  - "Your brain makes up about 2 percent of your weight but uses around 20 percent of your energy."
  - "Fingernails grow faster than toenails."
  - "Your skin is your largest organ."
  - "Red blood cells live for about 120 days."
  - "A baby's kneecaps start out as soft cartilage and only harden into bone over several years."
  - "The gluteus maximus, in your bottom, is the largest muscle in the body."
  - "Your funny bone is not a bone at all but a nerve."
  - "Your brain feels no pain itself, because it has no pain receptors."
  - "Your fingerprints begin forming before you are born."
  - "Babies can get hiccups in the womb."
  - "Your liver can regrow itself after part of it is removed."
  - "You are slightly taller in the morning than at night, by up to about a centimetre."
  - "The cornea at the front of your eye has no blood vessels."
  - "An adult has 32 teeth, including wisdom teeth."
  - "Images land upside down on your retina, and your brain flips them the right way up."
  - "Any two people are about 99.9 percent identical in their DNA."
  - "Your mouth makes around a litre of saliva a day."
  - "At rest, your heart pumps about five litres of blood around your body every minute."
  - "The lining of your stomach replaces itself every few days."
  - "Hair grows about a centimetre a month."
  - "The femur, or thigh bone, is the longest bone in the human body."
  - "The three tiny bones in your middle ear are called the hammer, anvil and stirrup."
  - "Your body is made up of roughly 60 percent water."
  - "Your nose and ears are mostly cartilage, not bone."
  - "Each of your eyes has a blind spot where the optic nerve leaves it, which your brain fills in without you noticing."
  - "Your sense of smell is closely linked to memory, because smell signals reach parts of the brain involved in emotion and memory."
  - "Your bones are constantly being broken down and rebuilt, with roughly a tenth of your skeleton renewed each year."
  - "A newborn baby can recognise its mother's voice, having heard it in the womb."
  - "Most people have 12 pairs of ribs."
  - "Your thumb is made of just two bones, while your other fingers have three."
