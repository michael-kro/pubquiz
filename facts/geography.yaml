topic: Geography
facts:
  - "Canada has the longest coastline of any country, at more than 200,000 kilometres."
  - "Vatican City is the smallest country in the world, at less than half a square kilometre."
  - "Africa is the only continent that lies in all four hemispheres: north, south, east and west."
  - "Bolivia has two capital cities: Sucre is the constitutional capital and La Paz is the seat of government."
  - "Australia is wider than the Moon. The Moon is about 3,470 km across, and Australia stretches roughly 4,000 km east to west."
  - "Lake Baikal in Russia is the deepest lake on Earth, at more than 1,600 metres."
  - "The Nile flows north, ending in the Mediterranean Sea."
  - "Istanbul is one of the few major cities in the world that sits on two continents, Europe and Asia."
  - "Measured from its base on the seabed, Hawaii's Mauna Kea is taller than Mount Everest."
  - "Chile is about 4,300 km long but, on average, less than 200 km wide."
  - "Greenland is the largest island in the world that is not a continent in its own right."
  - "Monaco is smaller than New York's Central Park."
  - "Only two countries in the world are doubly landlocked: Liechtenstein and Uzbekistan."
  - "Lesotho is completely surrounded by one other country, South Africa."
  - "The shore of the Dead Sea is the lowest dry land on Earth, more than 400 metres below sea level."
  - "Angel Falls in Venezuela is the tallest uninterrupted waterfall in the world, at 979 metres."
  - "The Pacific Ocean covers more of the planet than all of the world's land put together."
  - "Nepal has the only national flag that is not a rectangle or square."
  - "Iceland has no railways."
  - "Brazil is named after the brazilwood tree."
  - "The Pacific end of the Panama Canal is further east than the Atlantic end."
  - "China uses a single official time zone, even though it is almost as wide as the United States."
  - "Switzerland's international code, CH, comes from Confoederatio Helvetica, its official Latin name."
  - "The biggest desert in the world is not the Sahara but Antarctica."
  - "Kazakhstan is the largest landlocked country in the world."
  - "About a quarter of the Netherlands lies below sea level."
  - "Ecuador is the Spanish word for equator, and the country is named after the line running through it."
  - "Alaska is the most northern, most western and most eastern US state, because the Aleutian Islands cross the 180th meridian."
  - "The Atacama Desert in Chile is the driest non-polar desert, and some of its weather stations have gone years without rain."
  - "Papua New Guinea is home to more than 800 languages, the most of any country."
  - "San Marino and the Vatican City are both completely surrounded by Italy."
  - "Singapore is a city, an island and a country all at once."
  - "Kiribati is the only country that lies in all four hemispheres."
