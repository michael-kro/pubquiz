topic: Film, TV and Music
facts:
  - "The blood in the famous shower scene in Psycho was chocolate syrup."
  - "The famous line 'Play it again, Sam' is never actually said in Casablanca."
  - "Toy Story, released in 1995, was the first feature film made entirely with computer animation."
  - "Snow White and the Seven Dwarfs, from 1937, was the first full-length cel-animated feature film."
  - "The Return of the King won 11 Oscars, equalling the records of Ben-Hur and Titanic."
  - "Walt Disney himself provided the original voice of Mickey Mouse."
  - "Walt Disney won 22 competitive Academy Awards, more than anyone else."
  - "The mechanical shark in Jaws was nicknamed Bruce by the crew."
  - "Alfred Hitchcock made a brief cameo appearance in most of his films."
  - "In the original book of The Wizard of Oz, Dorothy's magic shoes are silver, not ruby."
  - "The Oscar statuette's official name is the Academy Award of Merit."
  - "The Lumiere brothers held the first public paid film screening in Paris on 28 December 1895."
  - "The Jazz Singer, from 1927, was the first feature-length film with synchronised talking sequences."
  - "Ian Fleming borrowed the name James Bond from an American bird expert."
  - "Dr. No, released in 1962, was the first film in the long-running James Bond series."
  - "Wallace and Gromit are made in Bristol by Aardman, using plasticine models."
  - "Doctor Who first aired on 23 November 1963."
  - "Coronation Street was first broadcast on 9 December 1960."
  - "Blue Peter first aired in October 1958."
  - "Top of the Pops ran on the BBC from 1964 to 2006."
  - "The Eurovision Song Contest was first held in 1956."
  - "ABBA won Eurovision in 1974 with the song 'Waterloo'."
  - "The first Glastonbury Festival took place in 1970."
  - "The Beatles released their first single, 'Love Me Do', in 1962."
  - "A standard piano has 88 keys."
  - "The word piano is short for pianoforte, Italian for soft-loud."
  - "The saxophone was invented in the 1840s by Adolphe Sax of Belgium."
  - "The theremin is an instrument you play without touching it."
  - "Beethoven kept composing even after he had gone almost completely deaf."
  - "Compact discs first went on sale in 1982."
  - "The BBC radio drama The Archers has been broadcast nationally since 1951."
  - "The Wilhelm scream is a stock sound effect that has been reused in many films since 1951."
