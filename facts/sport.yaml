topic: Sport
facts:
  - "Sheffield FC, founded in 1857, is the oldest football club in the world still in existence."
  - "The FA Cup, first played in 1871-72, is the oldest national football competition in the world."
  - "The first international football match was Scotland against England in Glasgow in 1872, and it finished 0-0."
  - "The marathon distance of 26 miles 385 yards comes from the 1908 London Olympics, where the race started at Windsor Castle."
  - "Tug of war was an Olympic sport at the Games between 1900 and 1920."
  - "Rugby union is named after Rugby School in Warwickshire."
  - "The first Test cricket match was played in Melbourne in 1877, between Australia and England."
  - "The Ashes got their name from a newspaper obituary for English cricket, printed after a defeat to Australia in 1882."
  - "A cricket pitch is 22 yards long."
  - "A maximum snooker break is 147, made by potting 15 reds with 15 blacks, then all six colours."
  - "A nine-dart finish is the fewest darts possible to win a leg of 501."
  - "Table tennis began as a Victorian parlour game, and was once sold under the name Ping-Pong."
  - "Badminton is named after Badminton House, a country estate in Gloucestershire."
  - "Basketball was invented by James Naismith in 1891, and the first baskets were peach baskets."
  - "Olympic gold medals have not been made of solid gold since 1912. They are mostly silver with a gold coating."
  - "The Queensberry Rules, the basis of modern boxing, were published in 1867."
  - "The first Tour de France was held in 1903."
  - "The Tour de France leader wears a yellow jersey because the newspaper that founded the race was printed on yellow paper."
  - "The Grand National at Aintree is about four and a half miles long and has 30 fences."
  - "The first Oxford and Cambridge Boat Race took place in 1829."
  - "The first football World Cup was held in Uruguay in 1930."
  - "Goal nets were invented by a Liverpool engineer, John Alexander Brodie, in 1889."
  - "Red and yellow cards were inspired by traffic lights, an idea of referee Ken Aston in 1966, and were first used at the 1970 World Cup."
  - "The penalty kick was introduced to football in 1891."
  - "St Andrews in Scotland set the standard of 18 holes for a round of golf, in 1764."
  - "A golf hole is 4.25 inches wide."
  - "Henry VIII played real tennis, the ancestor of lawn tennis."
  - "Major Walter Wingfield patented a game he called lawn tennis in 1874."
  - "Wimbledon, first held in 1877, is the oldest tennis tournament in the world."
  - "The first modern Olympic Games took place in Athens in 1896."
  - "The first modern Olympic marathon was won in 1896 by a Greek water carrier, Spyridon Louis."
  - "American sprinter Jesse Owens won four gold medals at the 1936 Berlin Olympics."
  - "The Olympic motto is Citius, Altius, Fortius, Latin for Faster, Higher, Stronger."
  - "Women first competed at the Olympics in 1900, in Paris."
  - "Curling is a sport that dates back to 16th-century Scotland."
  - "Rugby league began in 1895, when northern English clubs broke away to form the Northern Union."
