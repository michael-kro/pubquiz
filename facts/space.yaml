topic: Space
facts:
  - "Sunlight takes about eight minutes and twenty seconds to reach the Earth."
  - "A day on Venus is longer than its year."
  - "Saturn is less dense than water, so in a big enough bath it would float."
  - "The Moon is drifting away from the Earth by about 3.8 centimetres every year."
  - "Olympus Mons on Mars is the tallest known volcano in the solar system, about two and a half times the height of Everest."
  - "The Sun holds about 99.8 percent of all the mass in the solar system."
  - "A year on Mercury lasts just 88 Earth days."
  - "Uranus spins on its side, rolling around the Sun like a ball."
  - "Venus is the hottest planet, even though Mercury is closer to the Sun."
  - "Sunsets on Mars appear blue."
  - "Light from the Andromeda Galaxy left it about 2.5 million years ago."
  - "Both Voyager probes, launched in 1977, carry a golden record of sounds and images from Earth."
  - "Yuri Gagarin became the first human in space in 1961."
  - "Pluto was discovered in 1930 and has still not completed one orbit of the Sun since."
  - "Astronauts can grow a few centimetres taller in space as their spines stretch without gravity."
  - "Saturn has a giant hexagon-shaped storm swirling around its north pole."
  - "Saturn's moon Titan has lakes and rivers of liquid methane."
  - "The Milky Way contains hundreds of billions of stars."
  - "About 109 Earths could be lined up across the face of the Sun."
  - "Total solar eclipses happen because the Sun is about 400 times wider than the Moon and about 400 times farther away."
  - "In 1971 astronaut Alan Shepard hit golf balls on the Moon."
  - "The International Space Station circles the Earth roughly every 90 minutes."
  - "Halley's Comet returns about every 76 years."
  - "Most shooting stars are caused by specks of dust, typically about the size of a grain of sand."
  - "Mars has two small moons, Phobos and Deimos."
  - "The Moon has moonquakes, caused by things like the Earth's gravity tugging at it."
  - "Saturn's moon Enceladus shoots plumes of water ice out into space."
  - "Neptune was discovered in 1846 and finished its first orbit of the Sun in 2011."
  - "A teaspoon of neutron star material would weigh billions of tonnes."
  - "Neil Armstrong and Buzz Aldrin walked on the Moon in July 1969."
  - "Jupiter's Great Red Spot is a storm wider than the Earth that has been observed for well over a century."
  - "Jupiter is more than twice as massive as all the other planets in the solar system put together."
  - "Venus spins in the opposite direction to most planets, so the Sun rises in the west there."
  - "The Earth is not a perfect sphere: it bulges slightly at the equator because it spins."
  - "Footprints left on the Moon could last for millions of years because there is no wind or rain to erase them."
