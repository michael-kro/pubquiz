topic: History
facts:
  - "Cleopatra lived closer in time to the Moon landing than to the building of the Great Pyramid of Giza."
  - "Teaching was already going on at Oxford in 1096, long before the Aztec city of Tenochtitlan was founded in 1325."
  - "The Anglo-Zanzibar War of 1896 lasted under an hour and is usually described as the shortest war in history."
  - "Woolly mammoths were still alive on Wrangel Island when the Great Pyramid was being built."
  - "The Hundred Years' War actually lasted 116 years."
  - "The Eiffel Tower was built for the 1889 World's Fair and was originally meant to stand for only 20 years."
  - "Vikings reached North America around the year 1000, about 500 years before Columbus."
  - "Leonardo da Vinci wrote many of his notes in mirror writing, running right to left."
  - "The Terracotta Army in China was discovered in 1974 by farmers digging a well."
  - "The Rosetta Stone, found in 1799, helped scholars finally decipher Egyptian hieroglyphs."
  - "Mount Vesuvius buried the Roman town of Pompeii in the year 79."
  - "The Penny Black, issued in Britain in 1840, was the world's first adhesive postage stamp."
  - "Some of the bluestones at Stonehenge were brought from the Preseli Hills in Wales, about 140 miles away."
  - "During the Great Fire of London in 1666, the diarist Samuel Pepys buried his Parmesan cheese to save it."
  - "Peter the Great of Russia introduced a tax on beards in 1698."
  - "Henry VIII's warship the Mary Rose sank in 1545 and was raised from the seabed in 1982."
  - "The first powered flight by the Wright brothers in 1903 lasted just 12 seconds."
  - "Tutankhamun's tomb was discovered by Howard Carter in 1922."
  - "The London Underground opened in 1863, making it the oldest underground railway in the world."
  - "When Britain switched calendars in 1752, the day after 2 September was 14 September."
  - "Hadrian's Wall was begun in about the year 122 and ran across the north of Roman Britain."
  - "The Black Death reached Europe in the 1340s."
  - "The Colosseum in Rome could hold roughly 50,000 spectators."
  - "The Berlin Wall fell on 9 November 1989."
  - "Gutenberg's printing press in Germany dates from around 1450."
  - "The ancient Olympic Games are traditionally dated to 776 BC."
  - "The Great Pyramid of Giza was the tallest human-made structure in the world for nearly 4,000 years."
  - "The Titanic sank in April 1912 on its maiden voyage."
  - "Queen Victoria came to the throne at 18 and reigned for over 63 years."
  - "The Great Wall of China was built and rebuilt over many centuries by several different dynasties."
  - "The Pilgrims' ship, the Mayflower, sailed from Plymouth, England, in 1620."
  - "The Statue of Liberty was a gift from France to the United States, dedicated in 1886."
  - "The ancient Egyptians used a calendar of 365 days, which they divided into 12 months of 30 days plus five extra days."
