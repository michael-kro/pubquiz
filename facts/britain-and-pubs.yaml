topic: Britain and Pubs
facts:
  - "Red Lion is the most common pub name in Britain."
  - "In 1393 Richard II ordered ale-houses to hang out a sign, so that inspectors could find them."
  - "Pub opening hours were first restricted by a law of 1914, passed during the First World War."
  - "Since 2005, English and Welsh pubs can apply for licences to open all day and night."
  - "An imperial pint is about 568 millilitres."
  - "Hopped beer became common in England in the 1400s. Before that, the drink was unhopped ale."
  - "The Bass red triangle was the first trade mark ever registered in Britain, in 1876."
  - "Arthur Guinness signed a lease on the St James's Gate brewery in 1759 for 9,000 years."
  - "Burton upon Trent became a brewing capital partly because its water is rich in gypsum, which suits pale ale."
  - "India Pale Ale got its name from pale ale shipped from Britain to India in the 1700s and 1800s."
  - "The hand pump used to pull a pint was developed from the beer engine patented by Joseph Bramah in 1797."
  - "A firkin of beer holds nine imperial gallons, a kilderkin 18 and a barrel 36."
  - "Medieval towns appointed ale-conners to check the quality and strength of local ale."
  - "A Sumerian poem to Ninkasi, goddess of beer, from about 1800 BC includes a brewing recipe."
  - "Big Ben is the name of the bell, not the clock tower."
  - "Stonehenge's main stones were raised around 4,500 years ago."
  - "Magna Carta was sealed at Runnymede in 1215."
  - "The Great Fire of London of 1666 started in a baker's shop in Pudding Lane."
  - "Scotland's national animal is the unicorn."
  - "Wales is the only nation of the UK with no representation in the Union Flag."
  - "The last great Frost Fair on the frozen River Thames was held in 1814."
  - "Cheese-rolling races take place on Cooper's Hill in Gloucestershire."
  - "Llanwrtyd Wells in Wales hosts the World Bog Snorkelling Championships."
  - "The World Pooh Sticks Championships are held every year on the River Thames in Oxfordshire."
  - "The 999 emergency number was introduced in London in 1937."
  - "The Prime Meridian runs through Greenwich in London."
  - "The Domesday Book was compiled in 1086."
