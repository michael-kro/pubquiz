# Image scan findings accepted for a limited time, each with its reason. An entry stops applying on its expired_at
# date, so the scan fails again and the finding has to be dealt with, not forgotten.
vulnerabilities:
  - id: CVE-2026-63209
    paths:
      - usr/local/bin/cloudflared
    expired_at: 2026-11-02
    statement: >-
      A denial of service in the klauspost/compress library bundled with cloudflared 2026.10.1. cloudflared only
      talks to Cloudflare's own servers, so only Cloudflare could send it the data that triggers it. 2026.10.4 fixes
      it but was published on 2026-10-26, and new releases wait a week before they are used. On 2026-11-02 this
      expires: move CLOUDFLARED_VERSION in server/tunnel.ts to 2026.10.4 or later, then delete this entry.
